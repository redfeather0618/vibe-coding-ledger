<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLedger 智慧財務管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet text-indigo-400"></i> SmartLedger 財務管家
            </h1>
            <button onclick="resetData()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-700">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重設系統資料
            </button>
        </div>
    </header>

    <!-- 主要內容頁面容器 -->
    <main class="max-w-5xl mx-auto px-4 mt-6 mb-12">

        <!-- ==================== 頁面一：總覽 (首頁) ==================== -->
        <div id="view-overview" class="space-y-6 page-section">
            <!-- 總資產摘要卡片 -->
            <div class="bg-gradient-to-br from-indigo-600 to-slate-900 rounded-2xl p-6 text-white shadow-lg">
                <p class="text-xs font-medium text-indigo-200 uppercase tracking-wider">總資產 (Total Net Worth)</p>
                <h2 id="totalBalance" class="text-3xl md:text-4xl font-extrabold mt-1">NT$ 0</h2>
                <div class="mt-4 pt-4 border-t border-indigo-500/30 grid grid-cols-2 text-sm">
                    <div>
                        <span class="block text-indigo-200 text-xs">總收入統計</span>
                        <span id="totalIncome" class="font-bold text-green-300">+NT$ 0</span>
                    </div>
                    <div class="text-right">
                        <span class="block text-indigo-200 text-xs">總支出統計</span>
                        <span id="totalExpense" class="font-bold text-red-300">-NT$ 0</span>
                    </div>
                </div>
            </div>

            <!-- 兩欄佈局：銀行戶頭與圖表 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 各銀行帳戶金額總覽 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-building-columns text-indigo-600"></i> 各銀行戶頭與錢包餘額
                        </h3>
                        <button onclick="toggleAddAccountModal()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold px-2.5 py-1 rounded-md transition">
                            + 新增帳戶
                        </button>
                    </div>
                    <div id="accountList" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                        <!-- 動態渲染 -->
                    </div>
                </div>

                <!-- 支出分類統計圖表 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col justify-between">
                    <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600"></i> 當前支出項目分類佔比
                    </h3>
                    <div class="relative h-60">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 頁面二：記帳紀錄與明細 ==================== -->
        <div id="view-records" class="space-y-6 page-section hidden">
            <!-- 新增記帳表單 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 新增收支記錄
                </h3>

                <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3 p-1 bg-slate-100 rounded-xl">
                        <button type="button" id="typeExpenseBtn" onclick="setType('expense')" class="py-2 rounded-lg font-bold text-sm transition bg-white text-red-600 shadow-sm">
                            <i class="fa-solid fa-circle-minus mr-1"></i> 支出
                        </button>
                        <button type="button" id="typeIncomeBtn" onclick="setType('income')" class="py-2 rounded-lg font-bold text-sm transition text-slate-500">
                            <i class="fa-solid fa-circle-plus mr-1"></i> 收入 (工作/打工)
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (NT$)</label>
                            <input type="number" id="amount" required min="1" placeholder="例如：120" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
                            <input type="date" id="date" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">項目分類</label>
                            <select id="category" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">扣款 / 入帳帳戶</label>
                            <select id="accountSelect" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">備註 / 說明</label>
                        <input type="text" id="note" placeholder="例如：午餐便當、10月工作薪資" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-indigo-100">
                        確認儲存記帳
                    </button>
                </form>
            </div>

            <!-- 歷史交易明細 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i> 近期交易明細列表
                    </h3>
                    <span id="recordCount" class="text-xs text-slate-400">共 0 筆記錄</span>
                </div>

                <div class="overflow-x-auto max-h-96 overflow-y-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-100 sticky top-0">
                            <tr>
                                <th class="p-3">日期</th>
                                <th class="p-3">分類</th>
                                <th class="p-3">帳戶</th>
                                <th class="p-3">備註</th>
                                <th class="p-3 text-right">金額</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== 頁面三：支出紀錄 (Excel 各月份明細) ==================== -->
        <div id="view-monthly" class="space-y-6 page-section hidden">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-4">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-indigo-600"></i> 各月份歷史支出明細查詢
                        </h3>
                        <p class="text-xs text-slate-400 mt-0.5">檢視財務管理系統中各月份的詳細消費事項與分類統計</p>
                    </div>
                    <!-- 月份選擇下拉選單 -->
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-semibold text-slate-600">選擇月份：</label>
                        <select id="monthSelect" onchange="renderMonthlyExpense()" class="px-3 py-2 border border-slate-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                            <option value="1月">1月支出</option>
                            <option value="2月">2月支出</option>
                            <option value="3月">3月支出</option>
                            <option value="4月">4月支出</option>
                            <option value="5月">5月支出</option>
                            <option value="6月">6月支出</option>
                            <option value="7月">7月支出</option>
                            <option value="8月">8月支出</option>
                            <option value="9月">9月支出</option>
                            <option value="10月" selected>10月支出</option>
                            <option value="11月">11月支出</option>
                            <option value="12月">12月支出</option>
                        </select>
                    </div>
                </div>

                <!-- 該月份總計小卡 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-2">
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <span class="text-xs text-slate-400 block">該月總支出</span>
                        <span id="mTotalExpense" class="text-lg font-bold text-slate-800">NT$ 0</span>
                    </div>
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <span class="text-xs text-slate-400 block">伙食費</span>
                        <span id="mFood" class="text-lg font-bold text-indigo-600">NT$ 0</span>
                    </div>
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <span class="text-xs text-slate-400 block">交通費</span>
                        <span id="mTransport" class="text-lg font-bold text-indigo-600">NT$ 0</span>
                    </div>
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <span class="text-xs text-slate-400 block">書&學校雜費 / 其他</span>
                        <span id="mEduOther" class="text-lg font-bold text-indigo-600">NT$ 0</span>
                    </div>
                </div>

                <!-- 該月份詳細事項列表 -->
                <div class="overflow-x-auto max-h-[450px] overflow-y-auto pt-2">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-100 sticky top-0">
                            <tr>
                                <th class="p-3">日期</th>
                                <th class="p-3">消費事項 / 細項</th>
                                <th class="p-3 text-center">伙食費</th>
                                <th class="p-3 text-center">交通費</th>
                                <th class="p-3 text-center">書&學校雜費</th>
                                <th class="p-3 text-center">其他</th>
                                <th class="p-3 text-right">金額小計</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyItemList" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部固定導覽列 (TabBar) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 shadow-lg z-40">
        <div class="max-w-md mx-auto grid grid-cols-3 text-center">
            <button onclick="switchTab('overview')" id="tab-overview" class="flex flex-col items-center text-indigo-600 font-bold transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1">總覽首頁</span>
            </button>
            <button onclick="switchTab('records')" id="tab-records" class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-medium transition">
                <i class="fa-solid fa-pen-to-square text-lg"></i>
                <span class="text-xs mt-1">記帳與明細</span>
            </button>
            <button onclick="switchTab('monthly')" id="tab-monthly" class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-medium transition">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-xs mt-1">支出紀錄</span>
            </button>
        </div>
    </nav>

    <!-- 新增帳戶 Modal -->
    <div id="accountModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex justify-center items-center hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <h3 class="font-bold text-slate-800 text-lg">新增銀行 / 錢包帳戶</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">帳戶名稱</label>
                <input type="text" id="newAccName" placeholder="例如：富邦銀行、Line Pay" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">初始金額 (NT$)</label>
                <input type="number" id="newAccBalance" min="0" placeholder="0" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="toggleAddAccountModal()" class="w-1/2 py-2 bg-slate-100 text-slate-600 rounded-lg font-semibold hover:bg-slate-200 transition">取消</button>
                <button onclick="addAccount()" class="w-1/2 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">確認新增</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 各月份歷史支出明細資料範本
        const excelMonthlyData = {
            "1月": [
                {date: "2026-01-01", item: "午餐便當+飲料", food: 180, transport: 0, edu: 0, other: 0, amount: 180},
                {date: "2026-01-05", item: "悠遊卡加值", food: 0, transport: 500, edu: 0, other: 0, amount: 500}
            ],
            "2月": [
                {date: "2026-02-02", item: "早餐與咖啡", food: 120, transport: 0, edu: 0, other: 0, amount: 120}
            ],
            "3月": [
                {date: "2026-03-01", item: "月票交通費", food: 0, transport: 1200, edu: 0, other: 0, amount: 1200}
            ],
            "4月": [], "5月": [], "6月": [], "7月": [], "8月": [], "9月": [],
            "10月": [
                {date: "2026-10-01", item: "午餐便當", food: 120, transport: 0, edu: 0, other: 0, amount: 120},
                {date: "2026-10-02", item: "公車捷運交通", food: 0, transport: 60, edu: 0, other: 0, amount: 60}
            ],
            "11月": [], "12月": []
        };

        // 分類選項定義
        const categories = {
            expense: ['伙食費', '交通費', '書&學校雜費', '休閒娛樂', '其他'],
            income: ['工作薪資', '打工薪資', '實習津貼', '其他收入']
        };

        // 乾淨的預設示範帳戶（金額歸零或提供乾淨初始範例）
        const defaultAccounts = [
            { id: 'acc_post', name: '郵局', balance: 0 },
            { id: 'acc_bot', name: '土銀', balance: 0 },
            { id: 'acc_ctbc', name: '中信帳戶', balance: 0 },
            { id: 'acc_cash', name: '現金錢包', balance: 1000 },
            { id: 'acc_悠遊卡', name: '悠遊卡', balance: 100 }
        ];

        // 乾淨的預設示範交易紀錄
        const defaultTransactions = [
            { id: 't_1', type: 'income', amount: 5000, category: '打工薪資', accountId: 'acc_cash', date: '2026-10-01', note: '示範打工收入' },
            { id: 't_2', type: 'expense', amount: 120, category: '伙食費', accountId: 'acc_cash', date: '2026-10-05', note: '示範午餐支出' }
        ];

        // 狀態變數
        let accounts = JSON.parse(localStorage.getItem('sl_accounts_v4')) || defaultAccounts;
        let transactions = JSON.parse(localStorage.getItem('sl_transactions_v4')) || defaultTransactions;
        let currentType = 'expense';
        let chartInstance = null;

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
            renderAccounts();
            renderTransactions();
            updateSummaryAndChart();
            renderMonthlyExpense();
        });

        // 頁面切換控制 (Tab Switch)
        function switchTab(tabId) {
            ['overview', 'records', 'monthly'].forEach(id => {
                const section = document.getElementById(`view-${id}`);
                const btn = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    section.classList.remove('hidden');
                    btn.className = "flex flex-col items-center text-indigo-600 font-bold transition";
                } else {
                    section.classList.add('hidden');
                    btn.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 font-medium transition";
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 切換收入/支出類型
        function setType(type) {
            currentType = type;
            const expBtn = document.getElementById('typeExpenseBtn');
            const incBtn = document.getElementById('typeIncomeBtn');

            if (type === 'expense') {
                expBtn.className = "py-2 rounded-lg font-bold text-sm transition bg-white text-red-600 shadow-sm";
                incBtn.className = "py-2 rounded-lg font-bold text-sm transition text-slate-500";
            } else {
                incBtn.className = "py-2 rounded-lg font-bold text-sm transition bg-white text-green-600 shadow-sm";
                expBtn.className = "py-2 rounded-lg font-bold text-sm transition text-slate-500";
            }
            updateCategoryOptions();
        }

        // 更新下拉選單
        function updateCategoryOptions() {
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = categories[currentType].map(c => `<option value="${c}">${c}</option>`).join('');

            const accSelect = document.getElementById('accountSelect');
            accSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name} (餘額: $${a.balance.toLocaleString()})</option>`).join('');
        }

        // 新蒸收支記錄
        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const accountId = document.getElementById('accountSelect').value;
            const note = document.getElementById('note').value;

            const account = accounts.find(a => a.id === accountId);

            if (currentType === 'expense') {
                account.balance -= amount;
            } else {
                account.balance += amount;
            }

            const newTransaction = {
                id: 't_' + Date.now(),
                type: currentType,
                amount,
                category,
                accountId,
                date,
                note: note || category
            };

            transactions.unshift(newTransaction);
            saveAndRefresh();
            document.getElementById('transactionForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            alert('記帳成功！已同步更新帳戶餘額。');
        }

        // 刪除紀錄
        function deleteTransaction(id) {
            const index = transactions.findIndex(t => t.id === id);
            if (index !== -1) {
                const t = transactions[index];
                const account = accounts.find(a => a.id === t.accountId);
                if (account) {
                    if (t.type === 'expense') {
                        account.balance += t.amount;
                    } else {
                        account.balance -= t.amount;
                    }
                }
                transactions.splice(index, 1);
                saveAndRefresh();
            }
        }

        // 新增帳戶 Modal
        function toggleAddAccountModal() {
            document.getElementById('accountModal').classList.toggle('hidden');
        }

        function addAccount() {
            const name = document.getElementById('newAccName').value.trim();
            const balance = parseFloat(document.getElementById('newAccBalance').value) || 0;

            if (!name) {
                alert('請輸入帳戶名稱！');
                return;
            }

            accounts.push({ id: 'acc_' + Date.now(), name, balance });
            document.getElementById('newAccName').value = '';
            document.getElementById('newAccBalance').value = '';
            toggleAddAccountModal();
            saveAndRefresh();
        }

        // 渲染帳戶列表
        function renderAccounts() {
            const container = document.getElementById('accountList');
            container.innerHTML = accounts.map(a => `
                <div class="flex justify-between items-center p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                    <span class="font-medium text-slate-700 text-xs flex items-center gap-2">
                        <i class="fa-regular fa-credit-card text-indigo-400"></i>${a.name}
                    </span>
                    <span class="font-bold text-xs ${a.balance < 0 ? 'text-red-500' : 'text-slate-800'}">NT$ ${a.balance.toLocaleString()}</span>
                </div>
            `).join('');
        }

        // 渲染歷史清單
        function renderTransactions() {
            const container = document.getElementById('transactionList');
            document.getElementById('recordCount').innerText = `共 ${transactions.length} 筆記錄`;

            if (transactions.length === 0) {
                container.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">尚無任何交易記錄</td></tr>`;
                return;
            }

            container.innerHTML = transactions.map(t => {
                const account = accounts.find(a => a.id === t.accountId);
                const isExpense = t.type === 'expense';
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3 text-xs text-slate-500">${t.date}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-md text-xs font-semibold ${isExpense ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">${t.category}</span></td>
                        <td class="p-3 text-xs text-slate-600">${account ? account.name : '未知帳戶'}</td>
                        <td class="p-3 text-xs text-slate-600">${t.note}</td>
                        <td class="p-3 text-right font-bold ${isExpense ? 'text-red-500' : 'text-green-500'}">
                            ${isExpense ? '-' : '+'}NT$ ${t.amount.toLocaleString()}
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-red-500 transition text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 渲染各月份支出紀錄頁面
        function renderMonthlyExpense() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const items = excelMonthlyData[selectedMonth] || [];

            let totalExp = 0, totalFood = 0, totalTransport = 0, totalEduOther = 0;

            items.forEach(i => {
                totalExp += i.amount;
                totalFood += i.food;
                totalTransport += i.transport;
                totalEduOther += (i.edu + i.other);
            });

            document.getElementById('mTotalExpense').innerText = `NT$ ${totalExp.toLocaleString()}`;
            document.getElementById('mFood').innerText = `NT$ ${totalFood.toLocaleString()}`;
            document.getElementById('mTransport').innerText = `NT$ ${totalTransport.toLocaleString()}`;
            document.getElementById('mEduOther').innerText = `NT$ ${totalEduOther.toLocaleString()}`;

            const container = document.getElementById('monthlyItemList');
            if (items.length === 0) {
                container.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">此月份尚無登錄的支出明細資料</td></tr>`;
                return;
            }

            container.innerHTML = items.map(i => `
                <tr class="hover:bg-slate-50/80 transition">
                    <td class="p-3 text-xs text-slate-500">${i.date}</td>
                    <td class="p-3 font-medium text-slate-700 text-xs">${i.item}</td>
                    <td class="p-3 text-center text-xs text-slate-600">${i.food > 0 ? '$' + i.food.toLocaleString() : '-'}</td>
                    <td class="p-3 text-center text-xs text-slate-600">${i.transport > 0 ? '$' + i.transport.toLocaleString() : '-'}</td>
                    <td class="p-3 text-center text-xs text-slate-600">${i.edu > 0 ? '$' + i.edu.toLocaleString() : '-'}</td>
                    <td class="p-3 text-center text-xs text-slate-600">${i.other > 0 ? '$' + i.other.toLocaleString() : '-'}</td>
                    <td class="p-3 text-right font-bold text-red-500 text-xs">NT$ ${i.amount.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // 更新數據卡片與統計圖表
        function updateSummaryAndChart() {
            const totalBalance = accounts.reduce((acc, a) => acc + a.balance, 0);
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

            document.getElementById('totalBalance').innerText = `NT$ ${totalBalance.toLocaleString()}`;
            document.getElementById('totalIncome').innerText = `+NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `-NT$ ${totalExpense.toLocaleString()}`;

            const categoryTotals = {};
            transactions.filter(t => t.type === 'expense').forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['尚無支出'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#cbd5e1']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        // 儲存至 LocalStorage 並刷新畫面
        function saveAndRefresh() {
            localStorage.setItem('sl_accounts_v4', JSON.stringify(accounts));
            localStorage.setItem('sl_transactions_v4', JSON.stringify(transactions));
            renderAccounts();
            renderTransactions();
            updateSummaryAndChart();
            updateCategoryOptions();
        }

        // 重設資料
        function resetData() {
            if (confirm('確定要將系統資料重設為乾淨的預設示範狀態嗎？')) {
                accounts = JSON.parse(JSON.stringify(defaultAccounts));
                transactions = [...defaultTransactions];
                saveAndRefresh();
                renderMonthlyExpense();
            }
        }
    </script>
</body>
</html>
