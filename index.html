<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLedger 智慧多帳戶記帳與收支統計 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet text-yellow-300"></i> SmartLedger 記帳管家
            </h1>
            <button onclick="resetData()" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-indigo-100 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重置範例資料
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左側：資產總覽與帳戶管理 -->
        <section class="lg:col-span-1 space-y-6">
            <!-- 總資產卡片 -->
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-md">
                <p class="text-xs font-medium text-indigo-100 uppercase tracking-wider">總資產 (Total Balance)</p>
                <h2 id="totalBalance" class="text-3xl font-extrabold mt-1">NT$ 0</h2>
                <div class="mt-4 pt-4 border-t border-indigo-400/40 flex justify-between text-sm">
                    <div>
                        <span class="block text-indigo-200 text-xs">總收入</span>
                        <span id="totalIncome" class="font-bold text-green-300">+NT$ 0</span>
                    </div>
                    <div class="text-right">
                        <span class="block text-indigo-200 text-xs">總支出</span>
                        <span id="totalExpense" class="font-bold text-red-300">-NT$ 0</span>
                    </div>
                </div>
            </div>

            <!-- 帳戶列表區塊 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-building-columns text-indigo-500"></i> 銀行帳戶 / 錢包
                    </h3>
                    <button onclick="toggleAddAccountModal()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold px-2.5 py-1 rounded-md transition">
                        + 新增帳戶
                    </button>
                </div>
                <div id="accountList" class="space-y-3">
                    <!-- 帳戶項目會動態渲染於此 -->
                </div>
            </div>

            <!-- 支出分類統計圖表 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-500"></i> 支出分類統計
                </h3>
                <div class="relative h-48">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 右側：記帳輸入與交易明細 -->
        <section class="lg:col-span-2 space-y-6">
            <!-- 新增記帳表單 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 新增收支記錄
                </h3>

                <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <!-- 收支類型切換 -->
                    <div class="grid grid-cols-2 gap-3 p-1 bg-slate-100 rounded-xl">
                        <button type="button" id="typeExpenseBtn" onclick="setType('expense')" class="py-2 rounded-lg font-bold text-sm transition bg-white text-red-600 shadow-sm">
                            <i class="fa-solid fa-circle-minus mr-1"></i> 支出
                        </button>
                        <button type="button" id="typeIncomeBtn" onclick="setType('income')" class="py-2 rounded-lg font-bold text-sm transition text-slate-500">
                            <i class="fa-solid fa-circle-plus mr-1"></i> 收入 (工作/副業)
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 金額 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (NT$)</label>
                            <input type="number" id="amount" required min="1" placeholder="例如：120" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>

                        <!-- 交易日期 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
                            <input type="date" id="date" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>

                        <!-- 分類 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">項目分類</label>
                            <select id="category" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <!-- 動態渲染 -->
                            </select>
                        </div>

                        <!-- 選擇帳戶 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">收付款帳戶</label>
                            <select id="accountSelect" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <!-- 動態渲染 -->
                            </select>
                        </div>
                    </div>

                    <!-- 備註 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">備註 / 說明</label>
                        <input type="text" id="note" placeholder="例如：午餐便當、10月工作薪資" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition shadow-md">
                        確認儲存
                    </button>
                </form>
            </div>

            <!-- 歷史交易明細 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-500"></i> 歷史交易明細
                    </h3>
                    <span id="recordCount" class="text-xs text-slate-400">共 0 筆記錄</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-100">
                            <tr>
                                <th class="p-3">日期</th>
                                <th class="p-3">分類</th>
                                <th class="p-3">帳戶</th>
                                <th class="p-3">備註</th>
                                <th class="p-3 text-right">金額</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-slate-100">
                            <!-- 交易清單動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- 新增帳戶 Modal 快顯視窗 -->
    <div id="accountModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex justify-center items-center hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
            <h3 class="font-bold text-slate-800 text-lg">新增銀行 / 錢包帳戶</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">帳戶名稱</label>
                <input type="text" id="newAccName" placeholder="例如：國泰世華、Richart" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">初始金額 (NT$)</label>
                <input type="number" id="newAccBalance" min="0" placeholder="0" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="toggleAddAccountModal()" class="w-1/2 py-2 bg-slate-100 text-slate-600 rounded-lg font-semibold hover:bg-slate-200 transition">取消</button>
                <button onclick="addAccount()" class="w-1/2 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">新增</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 分類選項定義
        const categories = {
            expense: ['餐飲美食', '交通出行', '休閒娛樂', '日常購物', '居住繳費', '其他支出'],
            income: ['正職薪資', '兼職/副業', '投資收益', '獎金回饋', '其他收入']
        };

        // 預設示範資料
        const defaultAccounts = [
            { id: 'acc_1', name: '現金錢包', balance: 3500 },
            { id: 'acc_2', name: '中國信託', balance: 45000 },
            { id: 'acc_3', name: '台新 Richart', balance: 28000 }
        ];

        const defaultTransactions = [
            { id: 't_1', type: 'income', amount: 42000, category: '正職薪資', accountId: 'acc_2', date: '2025-10-05', note: '10月工作月薪' },
            { id: 't_2', type: 'expense', amount: 150, category: '餐飲美食', accountId: 'acc_1', date: '2025-10-10', note: '拉麵午餐' },
            { id: 't_3', type: 'expense', amount: 1200, category: '日常購物', accountId: 'acc_3', date: '2025-10-12', note: '買生活用品' }
        ];

        // 狀態變數
        let accounts = JSON.parse(localStorage.getItem('sl_accounts')) || defaultAccounts;
        let transactions = JSON.parse(localStorage.getItem('sl_transactions')) || defaultTransactions;
        let currentType = 'expense';
        let chartInstance = null;

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
            renderAccounts();
            renderTransactions();
            updateSummaryAndChart();
        });

        // 切換收入/支出類型
        function setType(type) {
            currentType = type;
            const expBtn = document.getElementById('typeExpenseBtn');
            const incBtn = document.getElementById('typeIncomeBtn');

            if (type === 'expense') {
                expBtn.className = "py-2 rounded-lg font-bold text-sm transition bg-white text-red-600 shadow-sm";
                incBtn.className = "py-2 rounded-lg font-bold text-sm transition text-slate-500";
            } else {
                incBtn.className = "py-2 rounded-lg font-bold text-sm transition bg-white text-green-600 shadow-sm";
                expBtn.className = "py-2 rounded-lg font-bold text-sm transition text-slate-500";
            }
            updateCategoryOptions();
        }

        // 更新下拉選單
        function updateCategoryOptions() {
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = categories[currentType].map(c => `<option value="${c}">${c}</option>`).join('');

            const accSelect = document.getElementById('accountSelect');
            accSelect.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name} (餘額: $${a.balance.toLocaleString()})</option>`).join('');
        }

        // 新增收支記錄
        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const accountId = document.getElementById('accountSelect').value;
            const note = document.getElementById('note').value;

            const account = accounts.find(a => a.id === accountId);

            // 扣款餘額檢核
            if (currentType === 'expense' && account.balance < amount) {
                if (!confirm(`警告：[${account.name}] 的金額不足（目前餘額: NT$${account.balance}），確定要繼續扣款嗎？`)) {
                    return;
                }
            }

            // 更新帳戶餘額
            if (currentType === 'expense') {
                account.balance -= amount;
            } else {
                account.balance += amount;
            }

            // 紀錄新增
            const newTransaction = {
                id: 't_' + Date.now(),
                type: currentType,
                amount,
                category,
                accountId,
                date,
                note: note || category
            };

            transactions.unshift(newTransaction);
            saveAndRefresh();
            document.getElementById('transactionForm').reset();
            document.getElementById('date').valueAsDate = new Date();
        }

        // 刪除紀錄並歸還/扣回金額
        function deleteTransaction(id) {
            const index = transactions.findIndex(t => t.id === id);
            if (index !== -1) {
                const t = transactions[index];
                const account = accounts.find(a => a.id === t.accountId);
                if (account) {
                    if (t.type === 'expense') {
                        account.balance += t.amount;
                    } else {
                        account.balance -= t.amount;
                    }
                }
                transactions.splice(index, 1);
                saveAndRefresh();
            }
        }

        // 新增帳戶 Modal 控制
        function toggleAddAccountModal() {
            document.getElementById('accountModal').classList.toggle('hidden');
        }

        function addAccount() {
            const name = document.getElementById('newAccName').value.trim();
            const balance = parseFloat(document.getElementById('newAccBalance').value) || 0;

            if (!name) {
                alert('請輸入帳戶名稱！');
                return;
            }

            accounts.push({
                id: 'acc_' + Date.now(),
                name,
                balance
            });

            document.getElementById('newAccName').value = '';
            document.getElementById('newAccBalance').value = '';
            toggleAddAccountModal();
            saveAndRefresh();
        }

        // 渲染帳戶列表
        function renderAccounts() {
            const container = document.getElementById('accountList');
            container.innerHTML = accounts.map(a => `
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <span class="font-medium text-slate-700 text-sm"><i class="fa-regular fa-credit-card mr-2 text-indigo-400"></i>${a.name}</span>
                    <span class="font-bold text-slate-800">NT$ ${a.balance.toLocaleString()}</span>
                </div>
            `).join('');
        }

        // 渲染歷史清單
        function renderTransactions() {
            const container = document.getElementById('transactionList');
            document.getElementById('recordCount').innerText = `共 ${transactions.length} 筆記錄`;

            if (transactions.length === 0) {
                container.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">尚無任何交易記錄</td></tr>`;
                return;
            }

            container.innerHTML = transactions.map(t => {
                const account = accounts.find(a => a.id === t.accountId);
                const isExpense = t.type === 'expense';
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3 text-xs text-slate-500">${t.date}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-md text-xs font-semibold ${isExpense ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">${t.category}</span></td>
                        <td class="p-3 text-xs text-slate-600">${account ? account.name : '未知帳戶'}</td>
                        <td class="p-3 text-xs text-slate-600">${t.note}</td>
                        <td class="p-3 text-right font-bold ${isExpense ? 'text-red-500' : 'text-green-500'}">
                            ${isExpense ? '-' : '+'}NT$ ${t.amount.toLocaleString()}
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-red-500 transition text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 更新數據卡片與統計圖表
        function updateSummaryAndChart() {
            const totalBalance = accounts.reduce((acc, a) => acc + a.balance, 0);
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

            document.getElementById('totalBalance').innerText = `NT$ ${totalBalance.toLocaleString()}`;
            document.getElementById('totalIncome').innerText = `+NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `-NT$ ${totalExpense.toLocaleString()}`;

            // 圖表統計數據（按支出類別計算）
            const categoryTotals = {};
            transactions.filter(t => t.type === 'expense').forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['無資料'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#cbd5e1']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        // 儲存至 LocalStorage 並刷新畫面
        function saveAndRefresh() {
            localStorage.setItem('sl_accounts', JSON.stringify(accounts));
            localStorage.setItem('sl_transactions', JSON.stringify(transactions));
            renderAccounts();
            renderTransactions();
            updateSummaryAndChart();
            updateCategoryOptions();
        }

        // 重置為預設資料
        function resetData() {
            if (confirm('確定要清除所有紀錄並重置為範例資料嗎？')) {
                accounts = [...defaultAccounts];
                transactions = [...defaultTransactions];
                saveAndRefresh();
            }
        }
    </script>
</body>
</html>
